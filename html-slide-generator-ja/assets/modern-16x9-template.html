<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>16:9 Slide Template</title>
  <style>
    :root {
      --bg-0: #071226;
      --bg-1: #0b1c3a;
      --bg-2: #12335f;
      --accent: #19d3ff;
      --accent-2: #36f3c8;
      --text-main: #f2f7ff;
      --text-sub: #9fb4cc;
      --title-size: 64px;
      --h2-size: 42px;
      --body-size: 28px;
      --note-size: 22px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: "Avenir Next", "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--text-main);
      background: linear-gradient(145deg, var(--bg-0), var(--bg-1) 50%, var(--bg-2));
    }
    #stage {
      width: 1600px; height: 900px;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(145, 208, 255, 0.26);
      background: rgba(8, 22, 44, 0.9);
    }
    .slide {
      position: absolute; inset: 0;
      padding: 84px 92px 76px;
      display: none;
      grid-template-rows: auto 1fr auto;
      gap: 20px;
    }
    .slide.active { display: grid; }
    h1 { font-size: var(--title-size); line-height: 1.08; }
    h2 { font-size: var(--h2-size); line-height: 1.12; }
    p, li { font-size: var(--body-size); line-height: 1.34; }
    .muted { font-size: var(--note-size); color: var(--text-sub); }
    .card {
      border: 1px solid rgba(145, 208, 255, 0.3);
      border-radius: 14px;
      background: rgba(10, 25, 49, 0.74);
      padding: 16px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    #page {
      position: fixed; right: 18px; bottom: 14px;
      background: rgba(7, 18, 38, 0.8);
      border: 1px solid rgba(145, 208, 255, 0.26);
      border-radius: 10px; padding: 8px 12px;
      font-size: 20px; font-weight: 700;
    }
  </style>
</head>
<body>
  <main id="stage">
    <section class="slide active" data-title="タイトル">
      <h1>タイトル</h1>
      <div class="grid-2">
        <div class="card"><p>要点1</p></div>
        <div class="card"><p>要点2</p></div>
      </div>
      <p class="muted">補足</p>
    </section>

    <section class="slide" data-title="内容">
      <h2>見出し</h2>
      <div class="card">
        <ul>
          <li>メッセージ1</li>
          <li>メッセージ2</li>
          <li>メッセージ3</li>
        </ul>
      </div>
      <p class="muted">補足</p>
    </section>
  </main>

  <div id="page">1 / 2</div>

  <script>
    (() => {
      const slides = Array.from(document.querySelectorAll('.slide'));
      const page = document.getElementById('page');
      const state = { index: 0 };

      function fit() {
        const stage = document.getElementById('stage');
        const scale = Math.min((window.innerWidth - 28) / 1600, (window.innerHeight - 28) / 900);
        stage.style.transform = `translate(-50%, -50%) scale(${Math.max(scale, 0.2)})`;
      }

      function render() {
        slides.forEach((s, i) => s.classList.toggle('active', i === state.index));
        page.textContent = `${state.index + 1} / ${slides.length}`;
      }

      function next() {
        if (state.index < slides.length - 1) {
          state.index += 1;
          render();
        }
      }

      function prev() {
        if (state.index > 0) {
          state.index -= 1;
          render();
        }
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
        if (e.key === 'Home') { e.preventDefault(); state.index = 0; render(); }
        if (e.key === 'End') { e.preventDefault(); state.index = slides.length - 1; render(); }
      });

      window.addEventListener('resize', fit);
      fit();
      render();
    })();
  </script>
</body>
</html>
